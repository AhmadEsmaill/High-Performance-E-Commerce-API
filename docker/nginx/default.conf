# ---------------------------------------------------------------------------
# Nginx as a REAL load balancer (this replaces the simulated LoadBalancerService).
# Requests are distributed across the three identical Laravel app containers
# using the "least_conn" strategy. Swap to round-robin (remove least_conn) or
# weighted (add `weight=N`) to mirror the strategies from LoadBalancerService.
# ---------------------------------------------------------------------------
upstream laravel_backend {
    least_conn;                 # round-robin if this line is removed
    server app-1:9000;          # add `weight=3` here for weighted distribution
    server app-2:9000;          # add `weight=2`
    server app-3:9000;          # add `weight=1`
}

server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.php;

    # Expose which backend node actually served the request (great for the demo).
    add_header X-Served-By $upstream_addr always;
    add_header X-LB-Strategy "nginx-least_conn" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass laravel_backend;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SERVED_BY $upstream_addr;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
