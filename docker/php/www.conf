; Custom PHP-FPM pool tuned for the concurrency / stress test.
; 3 app containers x 40 children = 120 concurrent PHP workers (> 100 users).
[www]
user = www-data
group = www-data
listen = 9000

pm = static
pm.max_children = 40
pm.max_requests = 1000

; Keep docker-compose environment variables (DB_HOST, REDIS_HOST, ...) visible.
clear_env = no
catch_workers_output = yes
